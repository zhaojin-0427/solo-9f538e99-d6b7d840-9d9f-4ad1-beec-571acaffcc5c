services:
  freshcheck:
    build: .
    image: freshcheck:latest
    ports:
      - "8000:8000"
    environment:
      FRESHCHECK_DB: /data/freshcheck.db
      FRESHCHECK_SECRET: change-me-in-production
      PORT: "8000"
    volumes:
      - freshcheck-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  freshcheck-data:
